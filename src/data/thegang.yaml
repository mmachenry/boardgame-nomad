challenges:
  - name: Quick Access
    number: 1
    rules: Put aside the white chips for this heist. In the first round, distribute the pocket cards and go straight to Round 2.
  - name: Noise Sensors
    number: 2
    rules: Turn over the 1-star chips for Rounds 1, 2, and 3 to the dark side. These chips cannot change owners after they have been taken from the center of the table.
  - name: Motion Detector
    number: 3
    rules: "If at least one of the community cards in Round 2 is a J, Q, or K, the following occurs: The player who has the white 1-star chip (from Round 1) must put their pocket cards face down in the discard pile and draw new pocket cards from the deck."
  - name: Retina Scan
    number: 4
    rules: "This challenge adds an extra condition for a successful heist. Before the player with the highest-value red chip reveals their hand in the showdown, you must do the following: The other players must confer and agree together on a card value (from 2 to ace) that they believe the player with the highest-value red chip has at least one of in their pocket cards. The player with the highest- value red chip obviously cannot take part in this discussion or give hints. If the players are incorrect, the heist is unsuccessful, even if the ranking of the red chips was correct."
  - name: Hasty Getaway
    number: 5
    rules: There is no distribution of orange chips in Round 3. Just reveal the fourth community card and go straight to Round 4.
  - name: Ventilation Shaft
    number: 6
    rules: Turn over the highest-value chips for rounds 1, 2, and 3 to the dark side. These chips cannot change owners after the first time they are taken from the center of the table.
  - name: Laser Tripwires
    number: 7
    rules: "If none of the community cards in Round 2 is a J, Q, or K, the following occurs: The player who has the highest-value white chip (from Round 1) must put their pocket cards face down in the discard pile and draw new pocket cards from the deck."
  - name: Blackout
    number: 8
    rules: At the beginning of Round 2, you must all discard your chips from Round 1.  At the beginning of Round 3, you must all discard your chips from Round 2.  At the beginning of Round 4, you must all discard your chips from Round 3.  This means that you all must pay close attention to who has which chips in each round in order to better evaluate changes in the strength of your hands.
  - name: Fingerprint Scan
    number: 9
    rules: "This challenge adds an extra condition for a successful heist. Before the player with the highest-value red chip reveals their hand in the showdown, you must do the following: The other players must confer and agree together on what hand ranking (high card to royal flush) they believe the player with the highest-value red chip has. The player with the highest-value red chip obviously cannot take part in this discussion or give hints. If the players are incorrect, the heist is unsuccessful, even if the ranking of the red chips was correct."
  - name: Security Cameras
    number: 10
    rules: Instead of two pocket cards, you all play with three! For the showdown, build the best five-card combination out of your three pocket cards and five community cards (instead of two pocket cards and five community cards).
specialists:
  - name: Informant
    number: 1
    rules: Decide which of you will secretly show exactly one of their pocket cards to one other player. Of course, this player may not tell the others which card they have seen.
  - name: Getaway Driver
    number: 2
    rules: Decide which of you will share what hand ranking their current hand has (pocket cards plus current community cards) with the rest of the players. They cannot share further details.
    example: "\"I have a pair.\" The player cannot share which pair they have!"
  - name: Investor
    number: 3
    rules: Once the pocket cards have been dealt in Round 1, each player says how many "face cards" (J, Q, K) they have.
    example: "Arsène has K, J and says: \"I have two face cards.\" Doris has Q, 3 and says: \"I have one face card.\". Trudy has A, 10 and says: \"I have no face cards.\""
  - name: Mastermind
    number: 4
    rules: Decide which of you will share with everyone how many cards of a specific value they have in their hand.
    example: "You decide as a group that Danny will tell you all how many 9s he has. He has 9, 3 and says: \"I have a 9.\""
  - name: Hacker
    number: 5
    rules: Decide which of you will take one card from the deck and add it to their hand. Afterward, this player must place one of their pocket cards face down on the discard pile. This can be the card that they have just drawn from the deck.
  - name: Coordinator
    number: 6
    rules: Once the pocket cards have been dealt in Round 1, each of you chooses one of your pocket cards. Everyone then simultaneously passes their chosen card to the player on their left as a pocket card.
  - name: Jack
    number: 7
    rules: "Decide which of you will add the \"Jack\" specialist card to your pocket. Afterward, this player must place one of their pocket cards face down on the discard pile. The \"Jack\" specialist card counts as a J (Jack). However, it does not have a suit, so it cannot be used for a flush. If you have a four of a kind with the other four Jacks, it counts as a Jack four of a kind with a Jack as a kicker card."
  - name: Math Whiz
    number: 8
    rules: Once the pocket cards have been dealt in Round 1, everyone states the sum of the value of their pocket cards. 2 to 10 have the values 2–10. J, Q, and K have the value of 10. A has the value of 11.
    example: "Arsène has 10, 7 in his hand and says: \"I have 17 total.\" Doris has Q, 3 and says: \"I have 13 total.\" Trudy has A, 10 and says: \"I have 21 total.\""
  - name: Con Artist
    number: 9
    rules: "Once the pocket cards have been dealt in Round 1, and everyone has looked at their cards, place them face down in a pile in the center of the table, shuffle them, and then redistribute them. Important: You must only mix the cards that were previously dealt and redistribute them. If you paid attention to which cards you had before they were mixed up, you know two of the cards that are somewhere in your fellow players' hands"
  - name: Muscle
    number: 10
    rules: "Decide which of you will take the \"Muscle\" specialist card and place it in front of you. During the showdown, this player beats any other player with a hand of the same ranking."
    example: "Arsène has the hand 2-2-J-8-7 in the showdown and the \"Muscle\" specialist card. Doris has 2-2-A-8-7. Trudy has 8-8-K-7-3. Danny has 7-7-7-8-2.  Arsène, Doris, and Trudy all have a pair. Arsène actually has the weakest pair. However, the \"Muscle\" specialist card turns his pair into the strongest pair. Danny has a three of a kind, a different rank, and is therefore stronger than Arsène. The correct order of the chips here would be Doris (1 star), Trudy (2 stars), Arsène (3 stars), Danny (4 stars)."
